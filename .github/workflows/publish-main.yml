name: Release

# Publishes github.com/whopio/whopsdk-go/v2 to GitHub whenever main carries a version not yet published
# there. Only whop-monorepo's SDK pipeline pushes main, and it renders this workflow
# (sdks/release/publish-main.yml.liquid there): plan asks each module whether it has the version
# (.github/release/cli.ts), build checks and packages it (scripts/package.sh), and one job per
# module publishes it, in order. Re-running a run, or dispatching one on main, publishes nothing a
# module already has.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in push order: every run waits its turn, so no version a delivery raised
# is skipped.
concurrency:
  group: publish-whopsdk-go
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      page: ${{ steps.plan.outputs.page }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - id: plan
        run: node .github/release/cli.ts plan --module github
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The release, built and checked from this commit: scripts/package.sh leaves what each module's
  # job publishes where the build uploads it from.
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false

      # package.sh runs the CI script, which expects golangci-lint on PATH.
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.10.1
          install-only: true

      - name: Package the release
        id: package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/package.sh

  # Runs even when nothing was published: a version tagged before it had a GitHub release gets one,
  # and a repo shipped dark writes nothing. A new tag goes only on the commit of the run that planned
  # to publish (PUBLISHED): re-run that run's failed jobs.
  github:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # cli.ts release creates the version's tag and GitHub release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: node .github/release/cli.ts release --module github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.plan.outputs.publish == 'true' }}

  # The release as a consumer gets it from where the modules published it: scripts/verify.sh.
  # The tag is what publishes the version here, so this checks it after the github job.
  verify:
    needs: [plan, github]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false

      # package.sh runs the CI script, which expects golangci-lint on PATH.
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.10.1
          install-only: true

      - name: Verify the release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/verify.sh
