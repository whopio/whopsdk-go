name: ci

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything the CI runs is scripts/ci.sh, which whop-monorepo's SDK pipeline also runs over every
  # build before delivering it. This job installs what it runs.
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          install-only: true

      - name: CI
        run: bash scripts/ci.sh
